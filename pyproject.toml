[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-ocp-ma-provider"
dynamic = ["version"]
description = "OVOS OCP skills as a Music Assistant music provider"
requires-python = ">=3.12"
dependencies = [
    "ovos-bus-client>=2.9.1a1",
    "ovos-utils>=0.8.5",
    "ovos-pydantic-models>=0.2.2a1",
    "music-assistant-models>=1.1.206",
]

[project.entry-points."music_assistant.provider"]
ovos_ocp = "ovos_ocp_ma_provider"

[tool.setuptools.dynamic]
version = { attr = "ovos_ocp_ma_provider.version.__version__" }

[tool.setuptools.packages.find]
include = ["ovos_ocp_ma_provider*"]

[tool.setuptools.package-data]
ovos_ocp_ma_provider = ["manifest.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]
